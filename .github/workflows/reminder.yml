# Sends the evening reminder at most once per evening.
# Triggered by the computer shutting down (source: pc), by the 22:00 schedule, or by hand.
name: Evening reminder

on:
  schedule:
    # 21:40, 22:00 and 22:20 in Istanbul (UTC+3, no daylight saving). GitHub can start scheduled
    # runs very late, so there are three chances, and a run only sends between 22:00 and 23:30.
    - cron: '40 18 * * *'
    - cron: '0 19 * * *'
    - cron: '20 19 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Who asked for the reminder
        type: choice
        options: [manual, pc, phone]
        default: manual
      at:
        description: The device's local time with its UTC offset, e.g. 2026-10-09T23:19:30+03:00
        type: string
        default: ''
      test:
        description: Send now and ignore the time window and the once-a-day rule
        type: boolean
        default: false

permissions:
  contents: write

env:
  TZ: Europe/Istanbul

jobs:
  wait:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait until 22:00
        run: |
          # Only an early start (21:00-21:59) waits. A late start never waits for the next evening.
          if [ "$(( 10#$(date +%H) ))" -eq 21 ]; then
            wait=$(( $(date -d 'today 22:00' +%s) - $(date +%s) ))
            echo "Waiting $wait seconds"
            sleep "$wait"
          fi

  send:
    needs: wait
    # A cancelled or timed-out wait must never lead to a send.
    if: ${{ !cancelled() && (needs.wait.result == 'success' || needs.wait.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One run at a time, so a shutdown and the 22:00 run can never both send.
    concurrency:
      group: reminder
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Decide
        id: decide
        env:
          SOURCE: ${{ inputs.source || 'schedule' }}
          AT: ${{ inputs.at }}
          TEST: ${{ inputs.test || false }}
          START_HOUR: ${{ vars.START_HOUR || '21' }}
        run: |
          # Rules live in decide.mjs (tested in decide.test.mjs). The log states only the decision.
          export LAST=$(git fetch -q origin state 2>/dev/null && git show FETCH_HEAD:last-sent.txt 2>/dev/null || echo none)
          node .github/push/decide.mjs

      - if: steps.decide.outputs.send == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .github/push/package-lock.json

      - if: steps.decide.outputs.send == 'true'
        run: npm ci --prefix .github/push

      - name: Send
        if: steps.decide.outputs.send == 'true'
        run: node .github/push/send.mjs
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}

      - name: Remember this evening
        if: steps.decide.outputs.send == 'true' && inputs.test != true
        env:
          GH_TOKEN: ${{ github.token }}
          EVENING: ${{ steps.decide.outputs.evening }}
        run: |
          # The date lives on a separate one-commit branch, so main's history and Pages stay untouched.
          dir=$(mktemp -d) && cd "$dir"
          git init -q
          echo "$EVENING" > last-sent.txt
          git add last-sent.txt
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Reminder sent for $EVENING"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:state
