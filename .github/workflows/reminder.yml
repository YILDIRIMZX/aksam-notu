# Sends the evening reminder once every evening after 22:00 (Istanbul time).
# The main trigger is an external cron service (cron-job.org) that calls workflow_dispatch with source=cron at 22:01,
# because GitHub's own schedule can start hours late. The scheduled runs below stay as a backup. Each one sends only between 22:00 and midnight
# and only if tonight's reminder has not gone out yet, so the reminder comes once and never in the middle of the night.
name: Evening reminder

on:
  schedule:
    # 22:04, 22:19, 22:37, 22:52, 23:13 and 23:34 in Istanbul (UTC+3, no daylight saving).
    # Minutes off the full hour, because GitHub is busiest (and most often late) at the top of the hour.
    - cron: '4 19 * * *'
    - cron: '19 19 * * *'
    - cron: '37 19 * * *'
    - cron: '52 19 * * *'
    - cron: '13 20 * * *'
    - cron: '34 20 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Who asked for the reminder
        type: choice
        options: [manual, cron, phone]
        default: manual
      at:
        description: The device's local time with its UTC offset, e.g. 2026-10-09T23:19:30+03:00 (optional)
        type: string
        default: ''
      test:
        description: Send now and ignore the time window and the once-a-day rule
        type: boolean
        default: false

permissions:
  contents: write

env:
  TZ: Europe/Istanbul

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One run at a time, so two scheduled runs can never both send.
    concurrency:
      group: reminder
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Decide
        id: decide
        env:
          SOURCE: ${{ github.event_name == 'schedule' && 'schedule' || inputs.source || 'manual' }}
          AT: ${{ inputs.at }}
          TEST: ${{ inputs.test || false }}
        run: |
          # Rules live in decide.mjs (tested in decide.test.mjs). The log states only the decision.
          export LAST=$(git fetch -q origin state 2>/dev/null && git show FETCH_HEAD:last-sent.txt 2>/dev/null || echo none)
          node .github/push/decide.mjs

      - if: steps.decide.outputs.send == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .github/push/package-lock.json

      - if: steps.decide.outputs.send == 'true'
        run: npm ci --prefix .github/push

      - name: Send
        if: steps.decide.outputs.send == 'true'
        run: node .github/push/send.mjs
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}

      - name: Remember this evening
        if: steps.decide.outputs.send == 'true' && inputs.test != true
        env:
          GH_TOKEN: ${{ github.token }}
          EVENING: ${{ steps.decide.outputs.evening }}
        run: |
          # The date lives on a separate one-commit branch, so main's history and Pages stay untouched.
          dir=$(mktemp -d) && cd "$dir"
          git init -q
          echo "$EVENING" > last-sent.txt
          git add last-sent.txt
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Reminder sent for $EVENING"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:state
